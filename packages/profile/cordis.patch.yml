# Ultra B0. Official Team settings below mirror the locked official profile patches.
# Only Ultra data/catalog/Studio are added. Existing data roots are never opened.
# Team-owned controls replace the two overlapping global continuable controls.

- id: session-persistence-jsonl
  disabled: true

- id: storage-json
  disabled: true

- id: storage-domain
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    - id: agent-team-ultra-data
      name: '@benz-ai-x/dsh-agent-team-ultra-profile/data'
      config:
        root: !!js dshHomePath('ultra-b0')

    - id: agent-team-ultra-compatibility
      name: '@benz-ai-x/dsh-agent-team-ultra-profile'
      group: true
      config:
        - id: agent-team
          name: '@deepseek-ai/dsh-experimental-agent-team'
          config:
            maxMembers: 8
            maxTasks: 256
            maxPendingMessagesPerMember: 64
            maxMessageBytes: 65536
            disposalTimeoutMs: 5000

        - id: tool-agent-team
          name: '@deepseek-ai/dsh-experimental-tool-agent-team'
          config:
            freshProvider: spawn
            forkProvider: fork

        - id: agent-team-ultra
          name: '@benz-ai-x/dsh-agent-team-ultra'
          config:
            defaultContinuationProvider: spawn
            maxProfiles: 64
            maxProfileBytes: 131072
            maxHooks: 32
            maxAssignmentBytes: 32768
            maxRevisionHistory: 32
            maxDiffEntries: 512

        - id: ui-agent-team
          name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

        - id: ui-agent-team-ultra
          name: '@benz-ai-x/dsh-client-ui-agent-team-ultra'
