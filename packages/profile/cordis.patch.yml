# Local Agent Team Ultra overlay. Apply after dsh-base and dsh-web-app.
# Team-owned controls replace the two overlapping global continuable controls.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: agent-team-codex
      name: '@deepseek-ai/dsh-experimental-agent-team-codex'
      config:
        catalogOwnerService: digitalEmployees
        sandbox: read-only

    - id: agent-team-claude-code
      name: '@deepseek-ai/dsh-experimental-agent-team-claude-code'
      config:
        catalogOwnerService: digitalEmployees
        sandbox: read-only

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: agent-team-ultra
      name: '@deepseek-ai/dsh-agent-team-ultra'
      config:
        defaultContinuationProvider: spawn
        maxProfiles: 64
        maxProfileBytes: 131072
        maxHooks: 32
        maxAssignmentBytes: 32768
        maxRevisionHistory: 32
        maxDiffEntries: 512
        maxRuns: 512
        maxRunEvidenceItems: 512
        maxEvalSets: 64
        maxEvalSetBytes: 262144
        maxEvalCases: 64
        maxEvalRuns: 256

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    - id: ui-agent-team-ultra
      name: '@deepseek-ai/dsh-client-ui-agent-team-ultra'
